<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Regional Intelligence</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="regional-page">

    <!-- ========================================================
         REGIONAL INTELLIGENCE
         ======================================================== -->

    <div id="regional-dashboard">


        <!-- ====================================================
             ASIA
             ==================================================== -->

        <section class="regional-column">

            <h2>Asia</h2>

            <div
                class="regional-news"
                id="regional-asia"
            >
                Loading...
            </div>

            <div class="regional-summary">

                <h3>Asia Summary</h3>

                <div id="summary-asia">
                    Loading...
                </div>

            </div>

        </section>


        <!-- ====================================================
             EUROPE / RUSSIA
             ==================================================== -->

        <section class="regional-column">

            <h2>Europe / Russia</h2>

            <div
                class="regional-news"
                id="regional-europe"
            >
                Loading...
            </div>

            <div class="regional-summary">

                <h3>Europe / Russia Summary</h3>

                <div id="summary-europe">
                    Loading...
                </div>

            </div>

        </section>


        <!-- ====================================================
             MIDDLE EAST
             ==================================================== -->

        <section class="regional-column">

            <h2>Middle East</h2>

            <div
                class="regional-news"
                id="regional-middle-east"
            >
                Loading...
            </div>

            <div class="regional-summary">

                <h3>Middle East Summary</h3>

                <div id="summary-middle-east">
                    Loading...
                </div>

            </div>

        </section>


        <!-- ====================================================
             AMERICA / OTHER
             ==================================================== -->

        <section class="regional-column">

            <h2>America / Other</h2>

            <div
                class="regional-news"
                id="regional-america"
            >
                Loading...
            </div>

            <div class="regional-summary">

                <h3>America / Other Summary</h3>

                <div id="summary-america">
                    Loading...
                </div>

            </div>

        </section>


    </div>

<script>
    
function formatRegionalSummary(text) {

    if (!text) {

        return "No regional summary available.";

    }


    return text

        .replace(
            /^### (.+)$/gm,
            "<h4>$1</h4>"
        )

        .replace(
            /^## (.+)$/gm,
            "<h3>$1</h3>"
        )

        .replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        )

        .replace(
            /^- (.+)$/gm,
            '<div class="regional-summary-bullet">• $1</div>'
        )

        .replace(
            /\n{2,}/g,
            '<div class="regional-summary-gap"></div>'
        )

        .replace(
            /\n/g,
            "<br>");
}
    
async function loadRegionalNews() {

    try {

        const response =
            await fetch("data/news.json");

        const data =
            await response.json();

        const articles =
            data.articles || [];

// ====================================================
// REGIONAL SUMMARIES
// ====================================================

const summaries =
    data.regional_summaries || {};


document.getElementById(
    "summary-asia"
).innerHTML =
    formatRegionalSummary(
        summaries.asia
    );


document.getElementById(
    "summary-europe"
).innerHTML =
    formatRegionalSummary(
        summaries.europe_russia
    );


document.getElementById(
    "summary-middle-east"
).innerHTML =
    formatRegionalSummary(
        summaries.middle_east
    );


document.getElementById(
    "summary-america"
).innerHTML =
    formatRegionalSummary(
        summaries.america_other
    );

        
        const regions = {

    asia: [],

    europe: [],

    middleEast: [],

    america: []

};


// ====================================================
// USE GPT REGION CLASSIFICATION
// ====================================================

articles.forEach(article => {

    const region =
        article.region ||
        "america_other";


    if (region === "asia") {

        regions.asia.push(article);

    }

    else if (
        region === "europe_russia"
    ) {

        regions.europe.push(article);

    }

    else if (
        region === "middle_east"
    ) {

        regions.middleEast.push(article);

    }

    else {

        regions.america.push(article);

    }

});


        // ====================================================
        // DISPLAY
        // ====================================================

        renderRegionalNews(
            "regional-asia",
            regions.asia
        );


        renderRegionalNews(
            "regional-europe",
            regions.europe
        );


        renderRegionalNews(
            "regional-middle-east",
            regions.middleEast
        );


        renderRegionalNews(
            "regional-america",
            regions.america
        );

    }


    catch (error) {

        console.error(
            "Regional news error:",
            error
        );

    }

}


function renderRegionalNews(
    elementId,
    articles
) {

    const container =
        document.getElementById(
            elementId
        );


    container.innerHTML = "";


    articles.forEach(article => {

        const item =
            document.createElement("div");


        item.className =
            "regional-news-item";


        item.innerHTML = `

            <div class="regional-news-title">
                ${article.title}
            </div>

            <div class="regional-news-meta">
                ${article.publisher || "Unknown Publisher"}
            </div>

        `;


        item.addEventListener(
            "click",
            () => {

                window.open(
                    article.url,
                    "_blank"
                );

            }
        );


        container.appendChild(item);

    });

}


loadRegionalNews();

</script>
</body>

</html>
