<!DOCTYPE html>
<html>
<head>
    <title>My News</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="login">
        <h1>My News</h1>

        <p>Enter password to continue:</p>

        <input type="password" id="password">
        <button onclick="login()">Enter</button>

        <p id="message"></p>
    </div>


    <div id="dashboard" style="display: none;">

        <div id="summary">
            <h2>Daily Summary</h2>
            <p>Your daily news summary will appear here.</p>
        </div>


<div id="important">

    <h2>Important News</h2>

    <div id="news-list">
        Loading news...
    </div>

</div>


        <div id="clock">
            <h2>World Clock</h2>
            <p>Your world clocks will appear here.</p>
        </div>


        <div id="status">
            <h2>Status</h2>
            <p>News processing information will appear here.</p>
        </div>

    </div>


<script>

    function login() {

        const password =
            document.getElementById("password").value;

        if (password === "news123") {

            document.getElementById("login").style.display = "none";

            document.getElementById("dashboard").style.display = "grid";

            loadNews();

        } else {

            document.getElementById("message").innerText =
                "Incorrect password.";

        }

    }


    async function loadNews() {

        const response =
            await fetch("data/news.json");

        const data =
            await response.json();

        const newsList =
            document.getElementById("news-list");

        newsList.innerHTML = "";

        data.articles.forEach(function(article) {

            const item =
                document.createElement("div");

            item.innerHTML = `
                <strong>${article.title}</strong>
                <br>
                <small>${article.publisher}</small>
            `;

            newsList.appendChild(item);

        });

    }

</script>

</body>
</html>
