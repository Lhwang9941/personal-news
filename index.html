<!DOCTYPE html>
<html>
<head>
    <title>My News</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="login">
        <h1>My News</h1>

        <p>Enter password to continue:</p>

        <input type="password" id="password">
        <button onclick="login()">Enter</button>

        <p id="message"></p>
    </div>


    <div id="dashboard" style="display: none;">

        <div id="summary">
            <h2>Daily Summary</h2>
            <p>Your daily news summary will appear here.</p>
        </div>


<div id="important">

    <h2>Important News</h2>

    <div id="news-list">
        Loading news...
    </div>

</div>


        <div id="clock">
            <h2>World Clock</h2>
            <p>Your world clocks will appear here.</p>
        </div>


        <div id="status">
            <h2>Status</h2>
            <p>News processing information will appear here.</p>
        </div>

    </div>


<script>

    function login() {

        const password =
            document.getElementById("password").value;

        if (password === "news123") {

            document.getElementById("login").style.display = "none";

            document.getElementById("dashboard").style.display = "grid";

            loadNews();

        } else {

            document.getElementById("message").innerText =
                "Incorrect password.";

        }

    }


    async function loadNews() {

        const response =
            await fetch("data/news.json");

        const data =
            await response.json();

        const newsList =
            document.getElementById("news-list");

        newsList.innerHTML = "";

data.articles.forEach(function(article) {

    const item =
        document.createElement("div");

    const keywords =
        article.matched_keywords
            .slice(0, 6)
            .join(" · ");

    const published =
        new Date(
            article.published_kst
        ).toLocaleString(
            "en-GB",
            {
                day: "2-digit",
                month: "short",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    item.innerHTML = `

        <a
            href="${article.url}"
            target="_blank"
            class="news-title"
        >
            ${article.title}
        </a>

        <div class="news-meta">
            ${article.publisher}
            ·
            ${article.country}
            ·
            ${published} KST
        </div>

        <div class="news-keywords">
            ${keywords}
        </div>

        <div class="news-score">
            Relevance: ${article.relevance_score}
        </div>

    `;

    newsList.appendChild(item);

});

    }

</script>

</body>
</html>
